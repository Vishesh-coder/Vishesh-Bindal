    <style>
        * {
            margin: 0;
            padding: 0;
            user-select: none;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            background: #f0f0f0;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .load {
            position: fixed;
            height: 100vh;
            width: 100%;
            background: #ee5555 url('loader.gif') no-repeat center;
            background-size: 40%;
            z-index: 1000;
        }

        .error {
            height: 100vh;
            width: 100%;
            background: url('404.gif') #f0f0f0 bottom no-repeat;
            background-size: 70%;
            z-index: 900;
        }

        h2 {
            position: absolute;
            z-index: 800;
            font-size: 40px;
            text-transform: capitalize;
            font-family: Helvetica;
            text-align: center;
            text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.5);
        }

        a {
            height: 100px;
            width: 400px;
            background: darkcyan;
            border-radius: 100px;
            color: white;
            text-transform: capitalize;
            display: grid;
            place-items: center;
            text-align: center;
            font-size: 18px;
            position: absolute;
            bottom: -160px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            transition: 1s cubic-bezier(.175, .885, .32, 1.275);
            text-decoration: none;
            z-index: 910;
        }

        a:hover {
            transform: scale(1.1);
            background: #24c7c7;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }

        .cover {
            display: none;
            place-items: center;
            color: white;
            text-align: center;
            position: fixed;
            height: 100vh;
            width: 100%;
            background: #091925;
            z-index: 950;
        }

            .error {

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script>
        $(window).on('load', function () {

            $('.load').fadeOut('slow', function () {
                $('a').css({
                    bottom: '60px'
                });

                $('a').hover(function () {
                    $('a').css({
                        '-webkit-transition': '0.5s cubic-bezier(.175, .885, .32, 1.275)',
                        '-o-transition': '0.5s cubic-bezier(.175, .885, .32, 1.275)',
                        transition: '0.5s cubic-bezier(.175, .885, .32, 1.275)',

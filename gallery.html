                display: -webkit-box;

            }

            .toggle.open {
                transition: 0.5s all;
            }

            .toggle:hover,
            .toggle.open:hover {
                transform: scale(1.1);
            }

            .toggle .toggle-line {
                width: 75%;
                height: 4px;
                background: white;
                border-radius: 20px;
                position: absolute;
                transition: 0.5s all;
                display: block;
            }

            .toggle .toggle-line:after {
                content: "";
                width: 100%;
                height: 100%;
                position: absolute;
                background: white;
                border-radius: 20px;
                transform: translateY(12px);
                transition: 0.5s all;
            }

            .toggle .toggle-line:before {
                content: "";
                width: 100%;
                height: 100%;
                position: absolute;
                background: white;
                border-radius: 20px;
                transform: translateY(-12px);
                transition: 0.5s all;
            }

            .toggle.open .toggle-line {
                background: transparent;
            }

            .toggle.open .toggle-line:before {
                transform: rotate(45deg);
            }

            .toggle.open .toggle-line:after {
                transform: rotate(-45deg);
            }

    <script>
        const toggleBtn = document.querySelector(".toggle");
        const menu = document.querySelector(".menu");
        let toggleOpen = false;
        toggleBtn.addEventListener("click", () => {
            if (!toggleOpen) {
                toggleBtn.classList.add("open");
                toggleOpen = true;
                document.querySelector('ul').style.right = "0";
            } else {
                toggleBtn.classList.remove("open");
                toggleOpen = false;
                document.querySelector('ul').style.right = "-250px";
            }
        });
        document.onclick = function (e) {
            if (e.target.id !== 'navLinks' && e.target.id !== 'links' && e.target.id !== 'toggle') {
                toggleBtn.classList.remove("open");
                toggleOpen = false;
                document.querySelector('ul').style.right = "-250px";
            }
        };

        function copy(id) {
            var text = document.getElementById(id).innerText;
            var elem = document.createElement("textarea");
            document.body.appendChild(elem);
            elem.value = text;
            elem.select();
            document.execCommand("copy");
            document.body.removeChild(elem);
        }

        let day = new Date();
        document.querySelector('.year').innerHTML = day.getFullYear();

        history.scrollRestoration = "manual"
    </script>
